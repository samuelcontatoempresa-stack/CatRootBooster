
name: Android CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      # 1. Baixar o repositório
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configurar Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Configurar Gradle 8.9
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 4. Instalar Android SDK
      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android SDK sdkmanager não encontrado."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 5. Encontrar automaticamente a pasta Android
      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR=""

          while IFS= read -r FILE; do
            DIR="$(dirname "$FILE")"

            if {
              [ -f "$DIR/app/build.gradle.kts" ] ||
              [ -f "$DIR/app/build.gradle" ]
            } && [ -f "$DIR/app/src/main/AndroidManifest.xml" ]; then
              PROJECT_DIR="$DIR"
              break
            fi
          done < <(
            find . \
              \( -path '*/.git' -o -path '*/.gradle' -o -path '*/build' \) -prune \
              -o -type f \( \
                -name 'settings.gradle' -o \
                -name 'settings.gradle.kts' \
              \) -print | sort
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Projeto Android não encontrado."
            echo "Verifique settings.gradle(.kts), app/build.gradle e AndroidManifest.xml."
            find . -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Projeto encontrado em: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      # 6. Validar estrutura e ferramentas
      - name: Validate toolchain and project
        shell: bash
        run: |
          set -euo pipefail

          java -version
          gradle --version

          test -f "$PROJECT_DIR/settings.gradle.kts" || \
            test -f "$PROJECT_DIR/settings.gradle"

          test -f "$PROJECT_DIR/app/build.gradle.kts" || \
            test -f "$PROJECT_DIR/app/build.gradle"

          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          echo "Validação concluída com sucesso."

      # 7. Compilar APK
      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          gradle -p "$PROJECT_DIR" \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace

      # 8. Disponibilizar APK para download
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CatRootBoost-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
