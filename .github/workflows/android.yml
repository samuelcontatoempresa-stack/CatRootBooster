
name: CatRoot Booster Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "Erro: sdkmanager não encontrado"
            exit 1
          fi
          echo "SDK Manager encontrado: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: |
          ZIP=""
          for candidate in CatRootBooster-Hybrid-FULL-COLORS-FIXED.zip CatRootBooster-Hybrid-FULL.zip CatRootBooster-Hybrid-Updated.zip CatRootBooster-Hybrid.zip; do
            if [ -f "$candidate" ]; then
              ZIP="$candidate"
              break
            fi
          done
          if [ -z "$ZIP" ]; then
            echo "Nenhum ZIP do projeto foi encontrado."
            ls -la
            exit 1
          fi
          echo "Extraindo: $ZIP"
          unzip -oq "$ZIP" -d .
          test -d CatRootBooster

      - name: Build APK
        run: |
          gradle -p CatRootBooster --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CatRootBooster-APK
          path: CatRootBooster/app/build/outputs/apk/debug/app-debug.apk
