
name: CatRoot Booster Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'CatRootBooster-Hybrid-FULL.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses and install packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract project
        run: |
          unzip -q CatRootBooster-Hybrid-FULL.zip -d .
          ls -la
          test -d CatRootBooster

      - name: Build APK
        run: |
          gradle -p CatRootBooster --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CatRootBooster-APK
          path: CatRootBooster/app/build/outputs/apk/debug/app-debug.apk
