
      - name: Diagnose project structure
        shell: bash
        run: |
          echo "Diretório atual:"
          pwd
          echo "Conteúdo da raiz:"
          ls -la
          echo "Arquivos Gradle:"
          find . -maxdepth 4 \
            \( -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "AndroidManifest.xml" \) -print

      - name: Validate toolchain
        shell: bash
        run: |
          set -e
          java -version
          gradle --version

          test -f settings.gradle.kts || test -f settings.gradle
          test -f build.gradle.kts || test -f build.gradle
          test -f app/build.gradle.kts || test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

          echo "Estrutura validada!"

      - name: Build debug APK
        shell: bash
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CatRootBoost-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
